services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inforoute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-inforoute}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ../api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-inforoute}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-inforoute}
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  pgdata:
